openapi: 3.0.3
info:
  title: MyLife OS Embedded Local REST API
  description: >
    Contract for routes currently implemented by the MyLife OS server hosted on
    the Samsung Galaxy M31 at port 8765. Planned routes are listed in the
    x-atom-planned-endpoints extension and are not callable yet.
  version: 1.0.0
servers:
  - url: http://mylife-os.local:8765/api/v1
    description: Primary Local mDNS Server
  - url: http://127.0.0.1:8765/api/v1
    description: On-Device Loopback

security:
  - HmacSignatureAuth: []
    MyLifeClientId: []
    MyLifeTimestamp: []

x-atom-planned-endpoints:
  - path: /digital/usage
    method: get
    status: not-implemented
  - path: /tracking/pause
    method: post
    status: not-implemented
  - path: /tracking/resume
    method: post
    status: not-implemented
  - path: /documents
    method: post
    status: not-implemented
  - path: /backup/export
    method: post
    status: not-implemented

paths:
  /ping:
    get:
      summary: Health check and latency probe
      security: []
      responses:
        '200':
          description: Server online
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  device: { type: string, example: "Samsung Galaxy M31" }
                  uptime_seconds: { type: integer, example: 3420 }

  /pair:
    post:
      summary: Initial device pairing handshake
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, device_name, client_fingerprint, signature, timestamp]
              properties:
                client_id: { type: string, example: "ATOM-WINDOWS" }
                device_name: { type: string, example: "Vishnu-Desktop-PC" }
                client_fingerprint: { type: string, example: "atom-win-a89c01bf" }
                timestamp: { type: integer, example: 1793912400 }
                signature: { type: string }
      responses:
        '200':
          description: Device paired successfully
        '401':
          description: Invalid pairing signature

  /status:
    get:
      summary: Server and tracking status; unavailable telemetry is null
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  battery:
                    type: object
                    description: Values are null and available is false until live battery telemetry is wired to this API.
                    properties:
                      level: { type: integer, nullable: true, example: null }
                      charging: { type: boolean, nullable: true, example: null }
                      available: { type: boolean, example: false }
                  storage:
                    type: object
                    properties:
                      free_mb: { type: integer, example: 45210 }
                      total_mb: { type: integer, example: 128000 }
                  tracking:
                    type: object
                    description: Values are null and available is false until live tracker state is wired to this API.
                    properties:
                      gps_geofence: { type: boolean, nullable: true, example: null }
                      step_counter: { type: boolean, nullable: true, example: null }
                      is_paused: { type: boolean, nullable: true, example: null }
                      available: { type: boolean, example: false }

  /modules/summary:
    get:
      summary: Aggregated executive summary across all 14 modules
      description: >
        Device and screen-time values that are not yet collected are returned as null;
        their telemetry_available flag is false. Consumers must not treat unknown values as zero.
      responses:
        '200':
          description: Consolidated 14-module snapshot

  /identity:
    get:
      summary: Get personal identity profile (Module 01)
      responses:
        '200':
          description: Profile retrieved
    put:
      summary: Update personal identity profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated
        '400':
          description: Invalid profile payload

  /finance/summary:
    get:
      summary: Financial totals, account balances, and budget status (Module 02)
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month, year]
            default: month
      responses:
        '200':
          description: Finance summary retrieved

  /finance/accounts:
    get:
      summary: List finance accounts
      responses:
        '200':
          description: Accounts retrieved

  /finance/transactions:
    get:
      summary: List filtered transactions
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Transactions list
    post:
      summary: Record new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                account_id: { type: integer, default: 1 }
                type: { type: string, default: EXPENSE }
                category: { type: string, default: General }
                amount: { type: number }
                transaction_date: { type: string, format: date-time, description: Defaults to server time when omitted }
                note: { type: string, nullable: true }
      responses:
        '201':
          description: Transaction created
        '400':
          description: Invalid transaction payload

  /health/today:
    get:
      summary: Today's health vitals, steps, sleep, and water count (Module 03)
      responses:
        '200':
          description: Health stats retrieved

  /health/water:
    post:
      summary: Log water intake in ml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_ml: { type: integer, default: 250, example: 250 }
      responses:
        '200':
          description: Water logged
        '400':
          description: Invalid water intake payload

  /health/metrics:
    post:
      summary: Record a health metric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metric_value]
              properties:
                metric_type: { type: string, example: WEIGHT_KG }
                metric_value: { type: number, example: 68.5 }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Health metric recorded
        '400':
          description: Invalid health metric payload

  /wellbeing/mood:
    get:
      summary: Mood and wellbeing logs (Module 04)
      responses:
        '200':
          description: Mood logs retrieved
    post:
      summary: Check in daily emotional state and journal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mood_rating: { type: integer, default: 4 }
                primary_emotion: { type: string, default: Calm }
                journal_entry: { type: string, nullable: true }
      responses:
        '200':
          description: Mood recorded
        '400':
          description: Invalid mood payload

  /location/places:
    get:
      summary: List saved places (Module 05)
      responses:
        '200':
          description: Places list

  /location/breadcrumbs:
    post:
      summary: Record a location breadcrumb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracy: { type: number, nullable: true, minimum: 0 }
      responses:
        '200':
          description: Breadcrumb recorded
        '400':
          description: Invalid location data

  /activities/today:
    get:
      summary: Tasks, routines, and scheduled time blocks for today (Module 06)
      responses:
        '200':
          description: Today's activities retrieved
  /activities/tasks:
    post:
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, default: New Task }
                priority: { type: string, default: MEDIUM }
                due_date: { type: string, nullable: true }
      responses:
        '201':
          description: Task created
        '400':
          description: Invalid task payload

  /habits:
    get:
      summary: Active habits and streaks (Module 07)
      responses:
        '200':
          description: Habits retrieved
  /habits/{id}/checkin:
    post:
      summary: Check in a habit for today
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Habit checked in
        '400':
          description: Invalid habit ID

  /learning/progress:
    get:
      summary: GATE CS and technical roadmap progress (Module 08)
      responses:
        '200':
          description: Learning progress retrieved
  /learning/study-session:
    post:
      summary: Log completed study session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, duration_minutes]
              properties:
                subject_id: { type: integer }
                topic: { type: string, default: GATE Study }
                duration_minutes: { type: integer }
                problems_solved: { type: integer, default: 0 }
      responses:
        '200':
          description: Study session logged
        '400':
          description: Invalid study session payload

  /career/summary:
    get:
      summary: Employment history, skill inventory, and freelance clients (Module 09)
      responses:
        '200':
          description: Career summary retrieved

  /social/contacts:
    get:
      summary: Contact roster, birthdays, and last interactions (Module 10)
      responses:
        '200':
          description: Contacts retrieved

  /nutrition/today:
    get:
      summary: Logged meals and dietary preferences (Module 11)
      responses:
        '200':
          description: Today's nutrition data retrieved
  /nutrition/meals:
    post:
      summary: Log meal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                meal_type: { type: string, default: LUNCH }
                food_items: { type: string, default: Meal }
                calories: { type: number, nullable: true }
                cost: { type: number, nullable: true }
      responses:
        '200':
          description: Meal logged
        '400':
          description: Invalid meal payload

  /documents:
    get:
      summary: List indexed documents in vault (Module 13)
      responses:
        '200':
          description: Documents retrieved

  /insights:
    get:
      summary: List AI personal insights (Module 14)
      responses:
        '200':
          description: Insights retrieved
    post:
      summary: Record an AI personal insight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                insight_type: { type: string, default: DAILY_SUMMARY }
                title: { type: string, default: Insight }
                content: { type: string, default: '' }
      responses:
        '200':
          description: Insight recorded
        '400':
          description: Invalid insight payload

components:
  securitySchemes:
    HmacSignatureAuth:
      type: apiKey
      in: header
      name: X-MyLife-Signature
      description: >
        HMAC-SHA256 signature over method, exact request URI, timestamp, and body hash.
        The client ID and timestamp headers are also required.
    MyLifeClientId:
      type: apiKey
      in: header
      name: X-MyLife-Client
      description: Paired client ID registered by the phone during the proof-checked pairing handshake.
    MyLifeTimestamp:
      type: apiKey
      in: header
      name: X-MyLife-Timestamp
      description: Unix timestamp in seconds; signed requests outside the phone's ±60-second window are rejected.

